<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог товаров</title>
    <style>
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .products-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
            background-color: #f4f6f8;
        }

        .card {
            display: flex;
            flex-direction: column;
            flex: 1 1 250px;
            max-width: 300px;
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 16px;
            margin-bottom: 8px;
            flex: 1;
        }

        .card .price {
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <h1>Каталог товаров</h1>

    <div class="products-container" id="products"></div>

    <script>
        const container = document.getElementById('products');

        async function loadProducts() {
            try {
                const response = await fetch('http://localhost:10800/api/products');
                
                const products = await response.json();

                for (let i = 0; i < products.length; i++) {
                    const product = products[i];

                    if (product.images && product.images.length > 0) {
                        imgUrl = product.images[0].imageUrl;
                    }
                    container.innerHTML += `
                        <div class="card">
                            <img src="${imgUrl}" alt="${product.name}">
                            <h3>${product.name}</h3>
                            <div class="price">${product.price} ₽</div>
                        </div>
                    `;
                }

            } catch (error) {
                console.error(error);
                container.innerHTML = `<p style="color: red;">Ошибка загрузки данных: ${error.message}</p>`;
            }
        }
        loadProducts();
    </script>
</body>
</html>
